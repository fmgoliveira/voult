name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste passwords, master passwords, recovery kits or tokens.**
        Security vulnerabilities go through the private form in the Security tab, not here.
  - type: dropdown
    id: component
    attributes:
      label: Where does it happen?
      options: [Browser extension, Android app, Server, Not sure]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Voult version
      placeholder: 1.0.0
  - type: input
    id: env
    attributes:
      label: Browser / Android version and device
      placeholder: Firefox 140 on Windows 11, or Android 15 on Pixel 8
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact anything sensitive.
