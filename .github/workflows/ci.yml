name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Extension e2e (Chromium, two profiles)
        run: |
          pnpm --filter @voult/extension exec playwright install --with-deps chromium
          xvfb-run -a pnpm --filter @voult/extension e2e
      # Remaining advisories (moderate/low) are in Expo build tooling that never ships.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
