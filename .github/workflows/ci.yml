name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Extension e2e (Chromium, two profiles)
        run: |
          pnpm --filter @voult/extension exec playwright install --with-deps chromium
          xvfb-run -a pnpm --filter @voult/extension e2e
      # Remaining advisories (moderate/low) are in Expo build tooling that never ships.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  desktop-windows:
    # The SSH agent talks to the real Windows OpenSSH client over a named pipe, so its integration
    # tests (and the packaged exe) only mean something on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @voult/core build
      - run: pnpm --filter @voult/desktop test
      - run: pnpm --filter @voult/desktop build:exe
      - name: Packaged exe runs without Node on PATH
        shell: pwsh
        run: |
          $env:VOULT_HOME = Join-Path $env:RUNNER_TEMP 'voult-smoke'
          $env:PATH = "$env:SystemRoot\System32"
          & "$PWD\apps\desktop\dist\voult.exe" --help
