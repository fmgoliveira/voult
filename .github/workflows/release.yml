name: Release

# Push a tag like v1.0.0 to build and publish: signed Android APK, Chrome and Firefox extension
# packages, a signed Firefox .xpi with its updates.json, and (optionally) a Chrome Web Store upload.
#
# Only what changed since the previous tag is rebuilt: Android when apps/mobile or shared code
# changed, the extension when apps/extension or shared code changed. Files of the part that was not
# rebuilt are copied unchanged from the previous release, so every release still lists everything.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      previous: ${{ steps.diff.outputs.previous }}
      extension: ${{ steps.diff.outputs.extension }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n1 || true)
          EXT=true; AND=true
          if [ -n "$PREV" ]; then
            # Shared code, dependencies and this workflow affect both apps.
            CHANGED=$(git diff --name-only "$PREV" "$GITHUB_SHA")
            SHARED='^(packages/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|scripts/|\.github/workflows/release\.yml$)'
            echo "$CHANGED" | grep -qE "$SHARED|^apps/extension/" || EXT=false
            echo "$CHANGED" | grep -qE "$SHARED|^apps/mobile/" || AND=false
            # Never skip a part whose files the previous release does not have to reuse.
            ASSETS=$(gh release view "$PREV" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true)
            echo "$ASSETS" | grep -q -- '-chrome\.zip$' || EXT=true
            echo "$ASSETS" | grep -q -- '\.apk$' || AND=true
          fi
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "extension=$EXT" >> "$GITHUB_OUTPUT"
          echo "android=$AND" >> "$GITHUB_OUTPUT"
          echo "previous tag: ${PREV:-none}; rebuild extension: $EXT; rebuild android: $AND"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  extension:
    needs: [changes, checks]
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: node scripts/release-metadata.mjs set-version "${GITHUB_REF_NAME#v}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @voult/core --filter @voult/ui-tokens build
      - run: pnpm --filter @voult/extension zip
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          # .output is a hidden directory: upload-artifact skips those unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          path: apps/extension/.output/*.zip

  firefox-sign:
    # Needs AMO API credentials; the signing steps are skipped when they are not configured.
    needs: extension
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: extension, path: dist }
      - name: Sign on AMO (unlisted)
        if: env.AMO_JWT_ISSUER != ''
        run: |
          mkdir signed
          unzip -q dist/*-firefox.zip -d firefox-src
          npx --yes web-ext@8 sign --source-dir firefox-src --artifacts-dir signed \
            --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          XPI=$(ls signed/*.xpi | head -n1)
          cp "$XPI" signed/voult-firefox.xpi
          SHA=$(sha256sum signed/voult-firefox.xpi | cut -d' ' -f1)
          node scripts/release-metadata.mjs firefox-updates "${GITHUB_REF_NAME#v}" voult-firefox.xpi "$SHA" > signed/updates.json
      - uses: actions/upload-artifact@v7
        if: env.AMO_JWT_ISSUER != ''
        with:
          name: firefox-signed
          if-no-files-found: error
          path: |
            signed/voult-firefox.xpi
            signed/updates.json

  android:
    needs: [changes, checks]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: node scripts/release-metadata.mjs set-version "${GITHUB_REF_NAME#v}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @voult/core --filter @voult/ui-tokens build
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Prebuild and assemble the release APK
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon
      - name: Sign with the release key
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing key configured: refusing to publish a debug-signed APK"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/zipalign" -p -f 4 app-release.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --out "voult-${GITHUB_REF_NAME#v}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "voult-${GITHUB_REF_NAME#v}.apk"
          rm "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          if-no-files-found: error
          path: apps/mobile/android/app/build/outputs/apk/release/voult-*.apk

  chrome-store:
    # Uploads a draft to the (unlisted) Chrome Web Store item when credentials exist. Publishing
    # stays a manual click in the dashboard.
    needs: extension
    runs-on: ubuntu-latest
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: extension, path: dist }
      - name: Upload draft
        if: env.CWS_EXTENSION_ID != ''
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          ZIP=$(ls dist/*-chrome.zip | head -n1)
          npx --yes chrome-webstore-upload-cli@3 upload --source "$ZIP" --auto-publish false

  publish:
    needs: [changes, extension, firefox-sign, android]
    # Runs when each part was either built or deliberately skipped, not when something failed.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIOUS: ${{ needs.changes.outputs.previous }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - name: Reuse the extension files from the previous release
        if: needs.changes.outputs.extension != 'true'
        run: |
          gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir assets             --pattern 'voult-*-chrome.zip' --pattern 'voult-*-firefox.zip'
          # Only present when that release was signed on AMO.
          gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir assets             --pattern 'voult-firefox.xpi' --pattern 'updates.json' || true
      - name: Reuse the Android APK from the previous release
        if: needs.changes.outputs.android != 'true'
        run: gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir assets --pattern 'voult-*.apk'
      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY"             --title "Voult ${GITHUB_REF_NAME#v}" --generate-notes
