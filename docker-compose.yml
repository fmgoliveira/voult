services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      # host:container. Point your reverse proxy at http://<docker-host>:6565
      - '6565:8787'
    volumes:
      - voult-data:/data

volumes:
  voult-data:
